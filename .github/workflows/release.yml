name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          # version.props is the one place the version lives: wbsh\wbsh.vcxproj
          # and wbshterm\wbshterm.vcxproj both import it, and installer\build.ps1
          # reads it. The two .iss files carry their own copy for standalone
          # ISCC runs, so they are kept in step here.
          $propsPath = 'version.props'
          $propsXml = [xml](Get-Content $propsPath)

          $versionGroup = $propsXml.Project.PropertyGroup | Where-Object { $_.WbshVersionMajor }
          if (-not $versionGroup) {
              throw "Could not find WbshVersionMajor/Minor/Patch in $propsPath"
          }
          $vMajor = [int]$versionGroup.WbshVersionMajor.Trim()
          $vMinor = [int]$versionGroup.WbshVersionMinor.Trim()
          $vPatch = [int]$versionGroup.WbshVersionPatch.Trim()

          switch ('${{ inputs.bump }}') {
              'major' {
                  $vMajor++
                  $vMinor = 0
                  $vPatch = 0
              }
              'minor' {
                  $vMinor++
                  $vPatch = 0
              }
              'patch' {
                  $vPatch++
              }
          }

          $newVersion = "$vMajor.$vMinor.$vPatch"

          $raw = Get-Content $propsPath -Raw
          $raw = $raw -replace '(?<=<WbshVersionMajor>)\d+(?=</WbshVersionMajor>)', $vMajor
          $raw = $raw -replace '(?<=<WbshVersionMinor>)\d+(?=</WbshVersionMinor>)', $vMinor
          $raw = $raw -replace '(?<=<WbshVersionPatch>)\d+(?=</WbshVersionPatch>)', $vPatch
          Set-Content -Path $propsPath -Value $raw -NoNewline

          foreach ($issPath in @('installer\wbsh.iss', 'installer\wbshterm.iss')) {
              $iss = Get-Content $issPath -Raw
              $iss = $iss -replace '#define AppVersion "\d+\.\d+\.\d+"', "#define AppVersion `"$newVersion`""
              Set-Content -Path $issPath -Value $iss -NoNewline
          }

          Write-Host "Bumped version to $newVersion"
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.props installer\wbsh.iss installer\wbshterm.iss
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # x64 first: its run also writes the SDK and agent-skill zips, which
      # run the shell it built. ARM64 is cross-compiled on this x64 runner.
      - name: Build installers
        shell: pwsh
        run: |
          foreach ($platform in 'x64', 'ARM64') {
              .\installer\build.ps1 -Platform $platform
              if (-not $?) { throw "installer\build.ps1 failed for $platform" }
          }

      - name: Check the artifacts are all there
        shell: pwsh
        run: |
          # A missing installer must fail the run rather than publish a
          # release that quietly ships half of what it promises.
          $version = "${{ steps.bump.outputs.version }}"
          $expected = @(
              "installer\output\wbsh-sdk-$version.zip",
              "installer\output\wbsh-skill-$version.zip"
          )
          foreach ($arch in 'x64', 'arm64') {
              $expected += @(
                  "installer\output\wbsh-setup-$arch.exe",
                  "installer\output\wbshterm-setup-$arch.exe",
                  "installer\output\wbsh-$version-portable-$arch.zip",
                  "installer\output\wbshterm-$version-portable-$arch.zip"
              )
          }

          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing release artifacts: $($missing -join ', ')" }

          foreach ($path in $expected) {
              "{0,-52} {1,8:N0} bytes" -f $path, (Get-Item $path).Length
          }

      # Code signing through SignPath (free for open source; see
      # docs/signing.md). Runs only when SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID are set; without them the release ships
      # unsigned, as before. Signed before the checksums are written.
      - name: Check for code signing
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          $enabled = [bool]$env:SIGNPATH_API_TOKEN -and [bool]$env:SIGNPATH_ORGANIZATION_ID
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
              Write-Host "SIGNPATH_API_TOKEN / SIGNPATH_ORGANIZATION_ID not set -- the release ships unsigned."
          }

      - name: Upload the files to sign
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            installer/output/*.exe
            installer/output/*.zip
          if-no-files-found: error

      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'wbsh' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'release' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer/output-signed

      - name: Use the signed files
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem installer\output-signed -Recurse -File -Include *.exe, *.zip
          if (-not $signed) { throw "SignPath returned no files." }
          foreach ($file in $signed) {
              Copy-Item $file.FullName (Join-Path installer\output $file.Name) -Force
              "signed  $($file.Name)"
          }

      - name: Write checksums and package manifests
        shell: pwsh
        run: .\tools\packaging\write-manifests.ps1 -Version "${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          $assets = Get-ChildItem "installer\output" -Include *.exe, *.zip, SHA256SUMS.txt -Recurse
          gh release create "v$version" $assets.FullName `
            --title "wbsh $version" `
            --generate-notes

      - name: Commit package manifests
        shell: pwsh
        run: |
          git add packaging
          git commit -m "chore: package manifests for ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      # Opens a pull request on microsoft/winget-pkgs. Needs a classic PAT
      # with public_repo scope in the WINGET_TOKEN secret; skipped without it.
      - name: Submit to winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
              Write-Host "WINGET_TOKEN is not set -- skipping the winget submission."
              exit 0
          }

          $version = "${{ steps.bump.outputs.version }}"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          foreach ($package in @('wbsh', 'wbshterm')) {
              $manifests = "packaging\winget\manifests\t\TomasTrachta\$package\$version"
              .\wingetcreate.exe submit --token $env:WINGET_TOKEN $manifests
          }
