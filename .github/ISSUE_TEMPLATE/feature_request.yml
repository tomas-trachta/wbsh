name: Feature request
description: Something wbsh or wbshterm does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working. If bash, Git Bash or another shell already does this, say which and how.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
